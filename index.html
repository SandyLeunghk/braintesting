<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>情緒月記 — 正方格成因選取（含其他成因）</title>
<style>
:root{
  --bg:#f6fbff; --card:#ffffff; --muted:#6b7280; --accent:#06b6d4;
  --accent-2:#7c3aed; --text:#0b1220;
  --joy:#10b981; --anx:#f59e0b; --ang:#ef4444; --sad:#3b82f6; --enn:#64748b; --disg:#6d28d9;
  --glass: rgba(6,182,212,0.06);
  font-family: "Noto Sans TC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg) 0%, #eaf6fb 100%);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:20px auto;padding:18px}
header{display:flex;gap:14px;align-items:flex-start}
h1{font-size:20px;margin:0}
p.lead{margin:4px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-top:14px}
.card{background:var(--card);padding:16px;border-radius:14px;box-shadow:0 10px 30px rgba(11,18,32,0.06);border:1px solid rgba(11,18,32,0.04)}
label{display:block;margin-bottom:6px;font-weight:700}
.small{font-size:13px;color:var(--muted)}
.q{margin-bottom:12px;padding:12px;border-radius:12px;background:linear-gradient(180deg,var(--glass), rgba(124,58,237,0.01))}
.options{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#f7fdff;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid rgba(11,18,32,0.04);min-width:150px;color:var(--text);transition:transform .12s,box-shadow .12s}
.opt:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(6,182,212,0.06)}
.opt input{display:none}
.opt.selected{border-color:var(--accent);box-shadow:0 10px 30px rgba(6,182,212,0.12);background:linear-gradient(90deg, rgba(6,182,212,0.06), rgba(124,58,237,0.03))}
.controls{display:flex;gap:8px;align-items:center;margin-top:10px}
button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800;box-shadow:0 6px 18px rgba(6,182,212,0.12)}
button.ghost{background:transparent;border:1px solid rgba(11,18,32,0.06);color:var(--muted);font-weight:700;box-shadow:none}
.summary{display:flex;flex-direction:column;gap:10px}
.bar{height:14px;background:#f1f5f9;border-radius:10px;overflow:hidden;border:1px solid rgba(11,18,32,0.03)}
.bar > i{display:block;height:100%}
.dominant{font-weight:900;color:var(--joy)}
.muted{color:var(--muted);font-size:13px}
.table-responsive{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse;color:var(--text);min-width:720px}
th,td{padding:10px;border-bottom:1px dashed rgba(11,18,32,0.04);text-align:left;font-size:13px;vertical-align:top}
td.cause{max-width:300px;white-space:normal;word-break:break-word;overflow-wrap:break-word}
#monthCards{display:none}
.month-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid rgba(11,18,32,0.04);box-shadow:0 8px 20px rgba(2,6,23,0.04)}
.month-card .meta{font-size:13px;color:var(--muted);margin-top:6px}
.poster-section{margin-top:18px;padding:14px;border-radius:12px;background:linear-gradient(180deg, rgba(124,58,237,0.02), rgba(6,182,212,0.02));display:flex;flex-direction:column;align-items:center;gap:10px}
.poster-wrap{width:100%;max-width:980px;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(11,18,32,0.08);background:#fff}
.poster{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}
.poster-credit{font-size:13px;color:var(--muted);padding:8px 12px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.lightbox img{max-width:calc(100% - 40px);max-height:calc(100% - 40px);border-radius:10px;box-shadow:0 30px 80px rgba(2,6,23,0.6)}
.lightbox.show{display:flex}

/* ---------- 正方格成因選取樣式 ---------- */
.cause-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.cause-tile{
  position:relative;
  aspect-ratio:1/1;
  min-height:80px;
  border-radius:10px;
  background:#fff;
  border:1px solid rgba(11,18,32,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  text-align:center;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
  user-select:none;
}
.cause-tile:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(6,182,212,0.06)}
.cause-tile input[type="checkbox"]{position:absolute;opacity:0;pointer-events:none}
.cause-tile .label-text{padding:6px;line-height:1.2}
.cause-tile.selected{background:linear-gradient(180deg, rgba(6,182,212,0.06), rgba(124,58,237,0.03));border-color:var(--accent);box-shadow:0 14px 36px rgba(6,182,212,0.12)}
.cause-tile:focus{outline:3px solid rgba(6,182,212,0.12);outline-offset:2px}
.cause-tile input[type="text"]{font-size:13px;display:none}
.cause-tile.selected input[type="text"]{display:block}
@media(max-width:720px){
  .grid{grid-template-columns:1fr;gap:12px}
  .cause-grid{grid-template-columns:repeat(2,1fr)}
  table{display:none}
  #monthCards{display:block}
  .poster{max-height:260px}
}
@media(max-width:980px){
  table{min-width:640px}
  .poster{max-height:360px}
}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>情緒月記</h1>
    </div>
  </header>
  

  <div class="grid">
    <!-- 左：填寫區 -->
    <section class="card" aria-labelledby="entryTitle">
      <div class="small">選擇日期（預設為今天），完成 5 題並勾選成因後按「儲存紀錄」。</div>

      <div style="margin-top:10px;">
        <label for="dateInput"><strong>日期</strong></label>
        <input id="dateInput" type="date" style="padding:10px;border-radius:8px;border:1px solid rgba(11,18,32,0.06);width:100%;max-width:220px" />
      </div>

      <form id="quizForm" style="margin-top:12px">
        <!-- Q1-Q5 -->
        <div class="q">
          <label><strong>Q1 感官超載度（聽覺）</strong></label>
          <div class="options" data-q="q1">
            <label class="opt"><input type="radio" name="q1" value="J"> J. 能自動過濾，不影響專注</label>
            <label class="opt"><input type="radio" name="q1" value="An"> An. 每個微小聲音都刺耳</label>
            <label class="opt"><input type="radio" name="q1" value="F"> F. 聲音大時會生氣</label>
            <label class="opt"><input type="radio" name="q1" value="S"> S. 聲音遙遠，提不起勁</label>
            <label class="opt"><input type="radio" name="q1" value="A"> A. 完全放空，不想管周遭</label>
            <label class="opt"><input type="radio" name="q1" value="D"> D. 聽到八卦直覺嫌棄</label>
          </div>
        </div>

        <div class="q">
          <label><strong>Q2 認知敏銳度（閱讀）</strong></label>
          <div class="options" data-q="q2">
            <label class="opt"><input type="radio" name="q2" value="J"> J. 讀得快，抓到關鍵字</label>
            <label class="opt"><input type="radio" name="q2" value="An"> An. 讀得快但常漏字</label>
            <label class="opt"><input type="radio" name="q2" value="F"> F. 覺得題目囉嗦、不耐煩</label>
            <label class="opt"><input type="radio" name="q2" value="S"> S. 看得進去但思考卡住</label>
            <label class="opt"><input type="radio" name="q2" value="A"> A. 眼睛看著但靈魂出竅</label>
            <label class="opt"><input type="radio" name="q2" value="D"> D. 覺得題目設計不佳</label>
          </div>
        </div>

        <div class="q">
          <label><strong>Q3 社交防禦度（被拍肩）</strong></label>
          <div class="options" data-q="q3">
            <label class="opt"><input type="radio" name="q3" value="J"> J. 自然微笑回頭，準備對話</label>
            <label class="opt"><input type="radio" name="q3" value="An"> An. 嚇一跳，心跳漏一拍</label>
            <label class="opt"><input type="radio" name="q3" value="F"> F. 身體緊繃，內心怒吼</label>
            <label class="opt"><input type="radio" name="q3" value="S"> S. 社交好累，敷衍應付</label>
            <label class="opt"><input type="radio" name="q3" value="A"> A. 假裝沒聽到，冷漠回應</label>
            <label class="opt"><input type="radio" name="q3" value="D"> D. 挑剔打量，保持距離</label>
          </div>
        </div>

        <div class="q">
          <label><strong>Q4 時間焦慮度（對今天的感覺）</strong></label>
          <div class="options" data-q="q4">
            <label class="opt"><input type="radio" name="q4" value="J"> J. 時間掌控得很好</label>
            <label class="opt"><input type="radio" name="q4" value="An"> An. 總覺得時間不夠用</label>
            <label class="opt"><input type="radio" name="q4" value="F"> F. 覺得時間過得很慢</label>
            <label class="opt"><input type="radio" name="q4" value="S"> S. 今天漫長、無成就感</label>
            <label class="opt"><input type="radio" name="q4" value="A"> A. 沒感覺，時間跟我無關</label>
            <label class="opt"><input type="radio" name="q4" value="D"> D. 行程無聊、令人作嘔</label>
          </div>
        </div>

        <div class="q">
          <label><strong>Q5 生理驅動力（食慾 / 多巴胺）</strong></label>
          <div class="options" data-q="q5">
            <label class="opt"><input type="radio" name="q5" value="J"> J. 飲食規律，正常飽足感</label>
            <label class="opt"><input type="radio" name="q5" value="An"> An. 嘴巴很饞，想靠咖啡提神</label>
            <label class="opt"><input type="radio" name="q5" value="F"> F. 想吃辛辣重口味宣洩</label>
            <label class="opt"><input type="radio" name="q5" value="S"> S. 胃口差，或空虛想吃甜食</label>
            <label class="opt"><input type="radio" name="q5" value="A"> A. 懶得吃，連點外送都麻煩</label>
            <label class="opt"><input type="radio" name="q5" value="D"> D. 對食物提不起興趣</label>
          </div>
        </div>

        <!-- 成因篇：正方格選取 -->
        <div class="q" id="causesSection">
          <label><strong>第二部分：成因篇（過去數小時內，可多選）</strong></label>
          <div class="small">請勾選符合你「過去數小時內」的真實情況（可多選）</div>

          <!-- 小圖示（放在成因區塊最上方） -->
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%2306b6d4'/><text x='12' y='16' font-size='10' text-anchor='middle' fill='white'>成因</text></svg>"
                 alt="成因圖示" style="width:40px;height:40px;border-radius:6px;flex:0 0 40px">
            <div class="small" style="margin-left:4px">可多選；勾選「其他」可補充文字說明。</div>
          </div>

          <div class="cause-grid" role="group" aria-label="成因選項">
            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="5-1" />
              <div class="label-text">(1) 嚴重空腹飢餓，或剛吃完高碳水暴飲暴食（食物昏迷）。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="5-2" />
              <div class="label-text">(2) 灌了高劑量咖啡因、提神飲料或大量甜食。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="5-3" />
              <div class="label-text">(3) 最近幾餐都隨便吃、缺水、甚至沒胃口跳過不吃。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="6-4" />
              <div class="label-text">(4) 已經連續高強度用腦（開會、寫報告）超過 2 小時沒中斷。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="6-5" />
              <div class="label-text">(5) 長期累積睡眠負債或昨晚失眠。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="6-6" />
              <div class="label-text">(6) 今天進行了大量高內耗的社交（應付奧客、討厭的同事）。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="7-7" />
              <div class="label-text">(7) 剛剛才放縱地連續刷了半小時以上的短影音或社群媒體。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="7-8" />
              <div class="label-text">(8) 手機通知一直跳，每幾分鐘就要點開看一次，視窗頻繁切換。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="8-9" />
              <div class="label-text">(9) 待在密閉空間、冷氣房很久，空氣很悶、缺乏通風。</div>
            </label>

            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="8-10" />
              <div class="label-text">(10) 周遭環境太吵、太悶熱（超過26°C），或光線太過昏暗。</div>
            </label>

            <!-- 新增：其他（可填寫） -->
            <label class="cause-tile" tabindex="0">
              <input type="checkbox" name="cause" value="other" />
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
                <div class="label-text">(11) 其他（請填寫）</div>
                <input type="text" name="cause_other_text" placeholder="請描述其他成因" style="display:none;margin-top:6px;padding:6px;border-radius:8px;border:1px solid rgba(11,18,32,0.06);width:100%;max-width:160px;font-size:13px" />
              </div>
            </label>

          </div>

          <div class="hint" style="margin-top:8px">提示：可多選；在手機上會自動調整為兩欄排列。</div>
        </div>

        <div class="controls">
          <button type="button" id="saveBtn">儲存紀錄</button>
          <button type="button" id="clearBtn" class="ghost">清除今日紀錄</button>
          <div style="margin-left:auto" class="hint">資料僅保存在此裝置（localStorage）</div>
        </div>
      </form>

      <div class="hint" id="lastSavedNote" style="margin-top:10px"></div>
    </section>

    <!-- 右：即時結果與月度彙整 -->
    <aside class="card" aria-labelledby="summaryTitle">
      <h2 id="summaryTitle" style="margin-top:0;font-size:16px">即時結果與本月彙整</h2>
      <div class="summary">
        <div><strong>選擇統計</strong> <span class="muted" id="choiceSummary">尚未填寫</span></div>

        <div>
          <strong>情緒百分比</strong>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <div style="min-width:140px">
              <div class="small">Joy <span id="pJ" style="float:right">0%</span></div>
              <div class="bar"><i id="bJ" style="width:0%;background:linear-gradient(90deg,var(--joy),#059669)"></i></div>
            </div>

            <div style="min-width:140px">
              <div class="small">Anxiety <span id="pAn" style="float:right">0%</span></div>
              <div class="bar"><i id="bAn" style="width:0%;background:linear-gradient(90deg,var(--anx),#f97316)"></i></div>
            </div>

            <div style="min-width:140px">
              <div class="small">Anger <span id="pF" style="float:right">0%</span></div>
              <div class="bar"><i id="bF" style="width:0%;background:linear-gradient(90deg,var(--ang),#dc2626)"></i></div>
            </div>

            <div style="min-width:140px">
              <div class="small">Sadness <span id="pS" style="float:right">0%</span></div>
              <div class="bar"><i id="bS" style="width:0%;background:linear-gradient(90deg,var(--sad),#2563eb)"></i></div>
            </div>

            <div style="min-width:140px">
              <div class="small">Ennui <span id="pA" style="float:right">0%</span></div>
              <div class="bar"><i id="bA" style="width:0%;background:linear-gradient(90deg,var(--enn),#64748b)"></i></div>
            </div>

            <div style="min-width:140px">
              <div class="small">Disgust <span id="pD" style="float:right">0%</span></div>
              <div class="bar"><i id="bD" style="width:0%;background:linear-gradient(90deg,var(--disg),#6d28d9)"></i></div>
            </div>
          </div>
        </div>

        <div>
          <strong>主導角色</strong>
          <div id="dominantText" style="margin-top:6px">—</div>
        </div>

        <div>
          <strong>深度診斷提示</strong>
          <div id="diagnosis" class="muted" style="margin-top:6px">—</div>
        </div>

        <hr style="border:none;border-top:1px dashed rgba(11,18,32,0.06);margin:8px 0">

        <div>
          <strong>本月彙整</strong>
          <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px;flex-wrap:wrap">
            <div style="width:36%;min-width:120px">
              <canvas id="pieChart" width="220" height="220" aria-label="情緒圓餅圖" style="width:100%;height:auto;border-radius:8px"></canvas>
            </div>

            <div style="flex:1">
              <div class="muted">每日紀錄表（含成因）</div>
              <div style="margin-top:8px">
                <div class="table-responsive">
                  <table id="monthTable" aria-live="polite">
                    <thead><tr><th>日期</th><th>主導情緒</th><th>百分比</th><th>成因</th></tr></thead>
                    <tbody></tbody>
                  </table>
                </div>
                <div id="monthCards" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </aside>
  </div>



  <div style="height:18px"></div>
  <footer class="muted" style="text-align:center">提示：資料僅保存在此裝置，清除瀏覽器資料會遺失紀錄。</footer>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <img id="lightboxImg" src="" alt="放大檢視海報">
</div>

<script>
/* ---------- 功能與互動（整合「其他成因」） ---------- */

function formatDateISO(d){ const y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+day; }
function monthKeyFromDate(d){ const y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2); return y+'-'+m; }

const dateInput = document.getElementById('dateInput');
const quizForm = document.getElementById('quizForm');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const lastSavedNote = document.getElementById('lastSavedNote');
const pEls = { J:document.getElementById('pJ'), An:document.getElementById('pAn'), F:document.getElementById('pF'),
  S:document.getElementById('pS'), A:document.getElementById('pA'), D:document.getElementById('pD') };
const bEls = { J:document.getElementById('bJ'), An:document.getElementById('bAn'), F:document.getElementById('bF'),
  S:document.getElementById('bS'), A:document.getElementById('bA'), D:document.getElementById('bD') };
const dominantText = document.getElementById('dominantText');
const diagnosis = document.getElementById('diagnosis');
const choiceSummary = document.getElementById('choiceSummary');
const monthTableBody = document.querySelector('#monthTable tbody');
const monthCards = document.getElementById('monthCards');
const pieCanvas = document.getElementById('pieChart');
const pieCtx = pieCanvas.getContext('2d');

dateInput.value = formatDateISO(new Date());

/* 正方格互動：點擊 label 或鍵盤 Enter/Space 切換 */
document.querySelectorAll('.cause-tile').forEach(tile=>{
  const cb = tile.querySelector('input[type="checkbox"]');
  tile.addEventListener('click', (e)=>{
    if(e.target.tagName.toLowerCase() === 'input') return;
    cb.checked = !cb.checked;
    tile.classList.toggle('selected', cb.checked);
    // 若 tile 含有文字欄，顯示或隱藏
    const otherInput = tile.querySelector('input[type="text"]');
    if(otherInput) otherInput.style.display = cb.checked ? 'block' : 'none';
    updateInstantFromForm();
  });
  tile.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      cb.checked = !cb.checked;
      tile.classList.toggle('selected', cb.checked);
      const otherInput = tile.querySelector('input[type="text"]');
      if(otherInput) otherInput.style.display = cb.checked ? 'block' : 'none';
      updateInstantFromForm();
    }
  });
});

/* 其餘題目 label 點擊選取樣式（保留原行為） */

/* localStorage helpers */
function loadMonthData(key){ try{ const raw = localStorage.getItem('moodlog-'+key); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; } }
function saveMonthData(key, data){ localStorage.setItem('moodlog-'+key, JSON.stringify(data)); }

/* calc */
function calcFromAnswers(answers){
  const counts = {J:0,An:0,F:0,S:0,A:0,D:0};
  Object.values(answers).forEach(v=>{ if(counts.hasOwnProperty(v)) counts[v]++; });
  const perc = {}; Object.keys(counts).forEach(k=> perc[k] = counts[k] * 20 );
  const maxVal = Math.max(...Object.values(perc));
  const dominant = Object.keys(perc).filter(k=>perc[k]===maxVal && maxVal>0);
  let diag = '無特殊警訊。';
  const high = Object.keys(perc).filter(k=>perc[k] >= 40);
  if(high.length >= 2){
    const set = new Set(high);
    if(set.has('An') && set.has('F')) diag = '防衛性過載 / 焦躁狀態：建議暫離座位、冷水洗手。';
    else if(set.has('S') && set.has('A')) diag = '認知燃盡 / 習得性無助：允許自己休息 15 分鐘。';
    else if(set.has('D') && set.has('F')) diag = '職場批判模式 / 社交排斥：建議下班後獨處並吃想吃的美食。';
    else diag = '偵測到多核心狀態，請短暫中斷並自我調節。';
  } else {
    if(dominant.includes('J')) diag = '高效心流狀態：適合處理核心任務。';
    else if(dominant.includes('An')) diag = '焦慮偏高：建議深呼吸、分段處理任務。';
    else if(dominant.includes('F')) diag = '憤怒/挫折感：建議短暫離開刺激源。';
    else if(dominant.includes('S')) diag = '憂鬱傾向：建議溫和活動或找人聊聊。';
    else if(dominant.includes('A')) diag = '倦怠：允許自己休息並做小幅活動。';
    else if(dominant.includes('D')) diag = '厭惡/排斥：注意長期不滿，考慮調整界線。';
  }
  return {counts, perc, dominant, diag};
}

/* read causes */
function readCausesFromForm(){
  const checked = Array.from(quizForm.querySelectorAll('input[name="cause"]:checked')).map(i=>i.value);
  const map = {
    '5-1':'嚴重空腹或暴食','5-2':'高劑量咖啡因/甜食','5-3':'最近餐食不佳/缺水',
    '6-4':'連續高強度用腦>2小時','6-5':'睡眠負債/失眠','6-6':'大量高內耗社交',
    '7-7':'剛刷短影音超過30分鐘','7-8':'手機通知頻繁/視窗切換',
    '8-9':'密閉悶熱/缺乏通風','8-10':'環境太吵/太熱或光線昏暗','other':'其他'
  };
  const texts = checked.map(k=>map[k] || k);
  const otherEl = quizForm.querySelector('input[name="cause_other_text"]');
  const otherText = (otherEl && otherEl.value && checked.includes('other')) ? otherEl.value.trim() : '';
  return {codes: checked, texts, otherText};
}

/* update instant */
function updateInstantFromForm(){
  const form = new FormData(quizForm);
  const answers = {};
  for(let i=1;i<=5;i++){ const q='q'+i; const v=form.get(q); if(v) answers[q]=v; }
  if(Object.keys(answers).length < 5){
    choiceSummary.textContent = '尚未完成 5 題';
    Object.keys(pEls).forEach(k=>{ pEls[k].textContent='0%'; bEls[k].style.width='0%'; });
    dominantText.textContent = '—';
    diagnosis.textContent = '請完成 5 題以顯示診斷';
    return;
  }
  const {counts, perc, dominant, diag} = calcFromAnswers(answers);
  choiceSummary.textContent = Object.values(answers).join(', ');
  Object.keys(perc).forEach(k=>{
    const el = document.getElementById('p'+k);
    if(el) el.textContent = perc[k] + '%';
    const be = document.getElementById('b'+k);
    if(be) be.style.width = perc[k] + '%';
  });
  if(dominant.length===1){
    const map = {J:'樂樂 Joy', An:'阿焦 Anxiety', F:'怒怒 Anger', S:'憂憂 Sadness', A:'阿廢 Ennui', D:'厭厭 Disgust'};
    dominantText.innerHTML = '<span class="dominant">'+map[dominant[0]]+'</span>（'+perc[dominant[0]]+'%）';
  } else {
    const map = {J:'樂樂', An:'阿焦', F:'怒怒', S:'憂憂', A:'阿廢', D:'厭厭'};
    dominantText.innerHTML = dominant.map(d=>map[d]+' '+perc[d]+'%').join(' + ');
  }
  diagnosis.textContent = diag;
  const causes = readCausesFromForm();
  choiceSummary.title = causes.texts.length ? causes.texts.join('；') : '';
}

/* save */
saveBtn.addEventListener('click', ()=>{
  const form = new FormData(quizForm);
  const answers = {};
  for(let i=1;i<=5;i++){ const q='q'+i; const v=form.get(q); if(!v){ alert('請完成所有 5 題再儲存。'); return; } answers[q]=v; }
  const date = dateInput.value; if(!date){ alert('請選擇日期。'); return; }
  const d = new Date(date); const key = monthKeyFromDate(d); const monthData = loadMonthData(key);
  const calc = calcFromAnswers(answers);
  const causes = readCausesFromForm();
  monthData[date] = {
    answers,
    counts: calc.counts,
    percentages: calc.perc,
    dominant: calc.dominant,
    causes: causes.codes,
    causeTexts: causes.texts,
    otherText: causes.otherText || '',
    savedAt: Date.now()
  };
  saveMonthData(key, monthData);
  lastSavedNote.textContent = '已儲存：' + date + '（主導：' + (calc.dominant.join(',') || '—') + '）';
  renderMonth(key);
});

/* clear */
clearBtn.addEventListener('click', ()=>{
  const date = dateInput.value; if(!date) return;
  const d = new Date(date); const key = monthKeyFromDate(d); const monthData = loadMonthData(key);
  if(monthData[date]){ if(!confirm('確定要刪除 ' + date + ' 的紀錄？')) return; delete monthData[date]; saveMonthData(key, monthData); lastSavedNote.textContent = '已刪除：' + date; renderMonth(key); }
  else alert('該日期沒有儲存紀錄。');
});

/* pie chart */
function resizeCanvasToDisplaySize(canvas){
  const ratio = window.devicePixelRatio || 1;
  const parent = canvas.parentElement;
  const w = Math.floor(parent.clientWidth);
  const h = Math.floor(parent.clientWidth);
  if(canvas.width !== w * ratio || canvas.height !== h * ratio){
    canvas.width = w * ratio;
    canvas.height = h * ratio;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    pieCtx.setTransform(ratio,0,0,ratio,0,0);
    return true;
  }
  return false;
}
function drawPie(dataMap){
  resizeCanvasToDisplaySize(pieCanvas);
  const entries = Object.entries(dataMap);
  const total = entries.reduce((s,[_k,v])=>s+v,0) || 1;
  const colors = {J:['#34d399','#059669'],An:['#f59e0b','#f97316'],F:['#fb7185','#dc2626'],
    S:['#60a5fa','#2563eb'],A:['#94a3b8','#64748b'],D:['#a78bfa','#6d28d9']};
  const cx = pieCanvas.width/2/(window.devicePixelRatio||1), cy = pieCanvas.height/2/(window.devicePixelRatio||1), r = Math.min(cx,cy)-6;
  pieCtx.clearRect(0,0,pieCanvas.width/(window.devicePixelRatio||1),pieCanvas.height/(window.devicePixelRatio||1));
  let start = -Math.PI/2;
  entries.forEach(([k,v])=>{
    if(v<=0) return;
    const angle = (v/total) * Math.PI*2;
    const grad = pieCtx.createLinearGradient(cx,cy,cx+r*Math.cos(start+angle/2),cy+r*Math.sin(start+angle/2));
    grad.addColorStop(0, colors[k][0]); grad.addColorStop(1, colors[k][1]);
    pieCtx.beginPath(); pieCtx.moveTo(cx,cy); pieCtx.arc(cx,cy,r,start,start+angle); pieCtx.closePath();
    pieCtx.fillStyle = grad; pieCtx.fill();
    start += angle;
  });
  pieCtx.fillStyle = '#0b1220'; pieCtx.font = '13px sans-serif'; pieCtx.textAlign = 'center';
  pieCtx.fillText('本月情緒分布', cx, cy+4);
}

/* render month */
function renderMonth(key){
  const monthData = loadMonthData(key);
  monthTableBody.innerHTML = '';
  monthCards.innerHTML = '';
  const totals = {J:0,An:0,F:0,S:0,A:0,D:0};
  const rows = Object.keys(monthData).sort();
  rows.forEach(date=>{
    const rec = monthData[date];
    const dom = rec.dominant && rec.dominant.length ? rec.dominant[0] : (function(){ const c = rec.counts || {}; let max=-1,k='—'; Object.keys(totals).forEach(k2=>{ if((c[k2]||0)>max){ max=c[k2]||0; k=k2; }}); return k; })();
    const percent = rec.percentages ? (rec.percentages[dom] || 0) : (rec.counts ? (rec.counts[dom]*20) : 0);
    const map = {J:'樂樂',An:'阿焦',F:'怒怒',S:'憂憂',A:'阿廢',D:'厭厭'};
    const causeText = (rec.causeTexts && rec.causeTexts.length) ? rec.causeTexts.join('；') : '';
    const fullCauseText = (rec.otherText && rec.otherText.length) ? (causeText ? (causeText + '；其他：' + rec.otherText) : ('其他：' + rec.otherText)) : (causeText || '');
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+date+'</td><td>'+ (map[dom]||'—') +'</td><td>'+percent+'%</td><td class="cause" title="'+(fullCauseText||'無')+'">'+(fullCauseText||'無')+'</td>';
    monthTableBody.appendChild(tr);
    const card = document.createElement('div'); card.className='month-card';
    card.innerHTML = '<div><strong>'+date+'</strong><div class="meta">'+ (map[dom]||'—') +' • '+percent+'%</div></div><div class="meta" title="'+(fullCauseText||'無')+'">成因：'+(fullCauseText||'無')+'</div>';
    monthCards.appendChild(card);
    Object.keys(totals).forEach(k=>{ totals[k] += (rec.percentages && rec.percentages[k]) ? rec.percentages[k] : ((rec.counts && rec.counts[k]) ? rec.counts[k]*20 : 0); });
  });
  const days = rows.length || 1;
  const avg = {}; Object.keys(totals).forEach(k=> avg[k] = Math.round((totals[k]/days) * 10) / 10 );
  drawPie(avg);
}

/* date change load */
dateInput.addEventListener('change', ()=>{
  const d = new Date(dateInput.value); const key = monthKeyFromDate(d); const monthData = loadMonthData(key);
  const rec = monthData[dateInput.value];
  document.querySelectorAll('label.opt').forEach(l=>l.classList.remove('selected'));
  quizForm.reset();
  // reset cause tiles visual
  document.querySelectorAll('.cause-tile').forEach(t=>{
    t.classList.remove('selected');
    const cb = t.querySelector('input[type="checkbox"]');
    if(cb) cb.checked = false;
    const otherInput = t.querySelector('input[type="text"]');
    if(otherInput) otherInput.style.display = 'none';
  });
  if(rec && rec.answers){
    Object.entries(rec.answers).forEach(([q,v])=>{
      const input = quizForm.querySelector('[name="'+q+'"][value="'+v+'"]');
      if(input){ input.checked = true; const lab = input.closest('label.opt'); if(lab) lab.classList.add('selected'); }
    });
    document.querySelectorAll('input[name="cause"]').forEach(cb=>cb.checked=false);
    if(rec.causes && Array.isArray(rec.causes)){
      rec.causes.forEach(code=>{
        const el = quizForm.querySelector('input[name="cause"][value="'+code+'"]');
        if(el){ el.checked = true; const tile = el.closest('.cause-tile'); if(tile) tile.classList.add('selected'); const otherInput = tile.querySelector('input[type="text"]'); if(otherInput) otherInput.style.display = el.checked ? 'block' : 'none'; }
      });
    }
    // 恢復其他文字
    if(rec.otherText){
      const otherEl = quizForm.querySelector('input[name="cause_other_text"]');
      const otherCb = quizForm.querySelector('input[name="cause"][value="other"]');
      if(otherEl && otherCb && otherCb.checked){
        otherEl.value = rec.otherText;
        otherEl.style.display = 'block';
      }
    } else {
      const otherEl = quizForm.querySelector('input[name="cause_other_text"]');
      if(otherEl) otherEl.style.display = 'none';
    }
    lastSavedNote.textContent = '載入已儲存紀錄：' + dateInput.value;
  } else lastSavedNote.textContent = '';
  updateInstantFromForm(); renderMonth(key);
});

/* init */
(function init(){
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const last = new Date(today.getFullYear(), today.getMonth()+1, 0);
  dateInput.min = formatDateISO(first);
  dateInput.max = formatDateISO(last);
  renderMonth(monthKeyFromDate(today));
  quizForm.addEventListener('change', updateInstantFromForm);
  updateInstantFromForm();
})();

posterImg && posterImg.addEventListener('click', ()=>{

});

});
